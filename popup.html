<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #00e676;
      --danger: #ff3d00;
      --text: #e0e0e0;
      --muted: #888888;
      --border: #2a2a2a;
    }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h2 { margin: 0; color: var(--accent); font-size: 18px; }
    
    .nav {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 6px;
    }
    .nav-btn {
      flex: 1;
      padding: 6px 0;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
    }
    .nav-btn.active {
      background: var(--border);
      color: var(--text);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .swipe-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--danger);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .swipe-btn:hover { background-color: #dd2c00; }

    .card {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    label.toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      padding: 4px 0;
    }

    input[type="text"] {
      width: 100%;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
      margin-top: 4px;
      margin-bottom: 6px;
    }

    button.action-btn {
      width: 100%;
      padding: 6px;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
      max-height: 100px;
      overflow-y: auto;
      font-size: 12px;
      margin: 6px 0 0 0;
    }
    li {
      padding: 4px 6px;
      background: #181818;
      border-radius: 4px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      word-break: break-all;
    }

    /* Delete Button Styling */
    .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
      margin-left: 8px;
    }
    .delete-btn:hover {
      color: #ff6e40;
    }

    /* Console Terminal Box */
    .console {
      background: #000000;
      border: 1px solid var(--border);
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      color: #00ff66;
      height: 160px;
      overflow-y: auto;
      padding: 8px;
      border-radius: 4px;
    }
    .log-line { margin-bottom: 4px; word-break: break-all; }

    #status {
      font-size: 11px;
      color: var(--accent);
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Goose Locked 🪿</h2>
  </div>

  <div class="nav">
    <button class="nav-btn active" data-target="tab-controls">Controls</button>
    <button class="nav-btn" data-target="tab-shortcuts">Shortcuts</button>
    <button class="nav-btn" data-target="tab-shields">Shields</button>
    <button class="nav-btn" data-target="tab-logs">Console</button>
  </div>

  <!-- TAB 1: CONTROLS & SWIPE -->
  <div id="tab-controls" class="tab-content active">
    <button id="swipeBtn" class="swipe-btn">Goose Swipe 🧹</button>
    
    <div class="card">
      <strong style="font-size: 12px;">Goose-Proof Whitelist</strong>
      <input type="text" id="whitelistInput" placeholder="Keep logged in (e.g. google.com)">
      <button id="addWhitelistBtn" class="action-btn">Add to Whitelist</button>
      <ul id="whitelistUl"></ul>
    </div>
  </div>

  <!-- TAB 2: QUICK QUACKS (,, BANGS) -->
  <div id="tab-shortcuts" class="tab-content">
    <div class="card">
      <strong style="font-size: 12px;">Add Custom Shortcut (,,)</strong>
      <input type="text" id="shortcutTrigger" placeholder="Trigger (e.g. yu)">
      <input type="text" id="shortcutUrl" placeholder="URL (e.g. youtube.com/results?search_query={q})">
      <button id="addShortcutBtn" class="action-btn">Save Shortcut</button>
      <ul id="shortcutList"></ul>
    </div>
  </div>

  <!-- TAB 3: PRIVACY SHIELDS & BLOCKLIST -->
  <div id="tab-shields" class="tab-content">
    <div class="card">
      <label class="toggle-row">
        <span>URL Tracker Stripper</span>
        <input type="checkbox" id="toggleTrackerStripper" checked>
      </label>
      <label class="toggle-row">
        <span>Smart HTTPS Upgrader</span>
        <input type="checkbox" id="toggleHttps" checked>
      </label>
      <label class="toggle-row">
        <span>Global Privacy Control (GPC)</span>
        <input type="checkbox" id="toggleGpc" checked>
      </label>
      <label class="toggle-row">
        <span>Auto-Decline Cookie Banners</span>
        <input type="checkbox" id="toggleCookieBanners" checked>
      </label>
    </div>

    <div class="card">
      <strong style="font-size: 12px;">Blocklist Domain</strong>
      <input type="text" id="blockInput" placeholder="example.com">
      <ul id="blockList"></ul>
    </div>
  </div>

  <!-- TAB 4: EXTENSION LOGS -->
  <div id="tab-logs" class="tab-content">
    <div class="card" style="padding: 6px;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
        <span style="font-size: 11px; font-weight: bold; color: var(--muted);">f12 execution console</span>
        <button id="clearLogsBtn" style="background: none; border: none; color: var(--danger); font-size: 10px; cursor: pointer;">Clear</button>
      </div>
      <div id="consoleLog" class="console"></div>
    </div>
  </div>

  <div id="status">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
